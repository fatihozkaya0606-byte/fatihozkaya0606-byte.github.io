function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=660;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.09,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.start();o.stop(c.currentTime+.13);setTimeout(()=>c.close(),400)}catch{}}
function finishLevel(){done=true;elapsed=Math.round((Date.now()-started)/1000);const stars=elapsed<60?3:elapsed<130?2:1;score+=20*stars;if(stars===3)hints=Math.min(25,hints+1);save();$('score').textContent=score;$('stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('winInfo').textContent=`${level}. bölümü ${elapsed} saniyede tamamladın. +${stars*20} puan kazandın!`;setTimeout(()=>$('winScreen').classList.remove('hidden'),500)}
$('rotate').addEventListener('click',()=>{if(done)return;const p=state.find(p=>p.id===selected&&!p.placed)||visiblePieces()[0];if(!p){notify('Önce renkli bir parçayı seç.');return}selected=p.id;p.rot=(p.rot+90)%360;render();notify('Parça döndürüldü.');});
$('hint').addEventListener('click',()=>{const p=state.find(p=>!p.placed);if(!p){return}if(hints<1){notify('İpucun kalmadı.');return}hints--;save();p.dx=0;p.dy=0;p.rot=0;p.placed=true;selected=null;render();if(state.every(x=>x.placed))finishLevel();else notify(`İpucu kullanıldı • ${hints} ipucun kaldı`)});
$('reset').addEventListener('click',newLevel);$('next').addEventListener('click',()=>{level++;save();newLevel()});$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'♫':'♪̸';notify(sound?'Ses açıldı':'Ses kapatıldı')});
newLevel();window.__brainGame={getState:()=>({level,score,hints,pieces:state.map(p=>({id:p.id,dx:p.dx,dy:p.dy,rot:p.rot,placed:p.placed}))})};
})();</script></body></html>
