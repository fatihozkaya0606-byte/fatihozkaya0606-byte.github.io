 else if(pattern==='hoops'){for(let y=66;y<252;y+=34)make('rect',{x:87,y,width:190,height:16,fill:secondary},stripes)}
 else if(pattern==='band')make('rect',{x:91,y:119,width:188,height:39,fill:secondary},stripes);
 else if(pattern==='dualband'){make('rect',{x:92,y:131,width:188,height:28,fill:'#171717'},stripes);make('rect',{x:92,y:137,width:188,height:17,fill:secondary},stripes)}
 else if(pattern==='center'){make('rect',{x:159,y:41,width:42,height:222,fill:secondary},stripes);make('rect',{x:155,y:41,width:4,height:222,fill:'#ffffff'},stripes);make('rect',{x:201,y:41,width:4,height:222,fill:'#ffffff'},stripes)}
 else if(pattern==='sleeves'){make('path',{d:'M88 90 L128 60 L136 144 L106 149Z M232 60 L271 90 L255 148 L224 144Z',fill:secondary},stripes)}
 else if(pattern==='diagonal'){make('path',{d:'M81 38 L120 38 L283 208 L283 269 L249 269 Z',fill:secondary},stripes)}
 else {make('path',{d:'M127 80 L91 111 L103 131 L129 116 Z M232 80 L269 111 L257 131 L231 116Z',fill:secondary,opacity:.92},stripes)}
 // Cloth-like shading and seams; a jersey rather than a generic shield.
 make('path',{d:'M101 96 L115 128 M244 128 L259 96 M137 234 Q181 243 224 234',fill:'none',stroke:'#ffffff66','stroke-width':2},group);
 make('path',{d:'M156 49 Q180 69 204 49',fill:'none',stroke:secondary,'stroke-width':5},group);
 make('path',{d:shirt,fill:'none',stroke:'#ffffff88','stroke-width':1.4},group);
 // A small neutral ball icon rather than an invented official team crest.
 make('circle',{cx:205,cy:95,r:12,fill:'#fffefb',stroke:'#22304645','stroke-width':1},group);
 make('path',{d:'M201 90 L209 90 L212 97 L205 103 L198 97Z',fill:'#3a4152'},group);
 make('path',{d:'M198 97L194 96 M209 90L214 86 M205 103L204 107',stroke:'#3a4152','stroke-width':1.3},group);
 make('path',{d:'M139 141 Q135 181 145 226 M224 146 Q227 175 215 222',fill:'none',stroke:'#ffffff19','stroke-width':5},group);
}
function flagPicture(group,q){
 // A neutral, recognisable fallback exists if the local licensed flag SVG is not loaded.
 textLine(group,q.visual,180,183,121);
 const href='flags/'+q.code.toLowerCase()+'.svg';
 make('rect',{x:61,y:65,width:238,height:156,rx:5,fill:'#fefefe',stroke:'#d5d5d5','stroke-width':2},group);
 const im=make('image',{href,x:65,y:69,width:230,height:148,preserveAspectRatio:'xMidYMid meet'},group);
 im.addEventListener('error',()=>{im.remove();group.querySelectorAll('rect').forEach(x=>{if(x.getAttribute('x')==='61')x.remove()})});
 if(q.type==='country')textLine(group,q.caption,180,251,q.caption.length>24?16:20,'#223b57','900',236);
}
function buildImage(group){const q=question,bg=['#eaf1ff','#fff5df','#eefff6','#fff0f3','#f7edff'][hash(q.id)%5];
 make('rect',{x:56,y:28,width:248,height:248,rx:17,fill:bg},group);
 if(q.type==='club')kitVisual(group,q);
 else if(q.type==='flag'||q.type==='country')flagPicture(group,q);
 else if(q.type==='city'){textLine(group,'🏙️',180,143,90);textLine(group,q.visual,180,219,q.visual.length>19?21:q.visual.length>12?25:31,'#19344a','1000',232)}
 else if(q.type==='landmark'){textLine(group,q.visual,180,163,114);textLine(group,q.caption,180,235,q.caption.length>22?17:21,'#263856','900',238)}
 else textLine(group,q.visual,180,191,143);
}
function textLine(g,txt,x,y,font=26,color='#1e2a3e',weight='800',maxWidth=230){const t=make('text',{x,y,'text-anchor':'middle','font-size':font,'font-weight':weight,fill:color,'font-family':'system-ui, Arial, sans-serif'},g);t.textContent=txt;t.setAttribute('textLength',txt.length>25?maxWidth:'');if(txt.length>25)t.setAttribute('lengthAdjust','spacingAndGlyphs');return t}
function render(){const ghost=$('ghosts'),root=$('tiles'),svg=$('stage');ghost.replaceChildren();root.replaceChildren();svg.querySelectorAll('defs clipPath').forEach(c=>c.remove());const defs=svg.querySelector('defs');
 {const preview=make('g',{opacity:step<=5?.22:step<100?.16:.12},ghost);buildImage(preview)}
 for(const p of tiles){if(!p.placed)make('polygon',{points:ptstr(p.pts),class:'place'},ghost);const clip=make('clipPath',{id:'clip-'+p.id,clipPathUnits:'userSpaceOnUse'},defs);make('polygon',{points:ptstr(p.pts)},clip)}
 const sorted=[...tiles].sort((a,b)=>a.placed===b.placed?0:a.placed?-1:1);for(const p of sorted){const x=make('g',{'data-piece':p.id,class:'piece '+(p.placed?'placed':'drag-polygon'),transform:transform(p)},root);const cl=make('g',{'clip-path':'url(#clip-'+p.id+')'},x);buildImage(cl);make('polygon',{points:ptstr(p.pts),fill:'url(#tileBevel)',stroke:p.placed?'#ffffff38':'#ffffffd6','stroke-width':p.placed?1.0:2.5,'stroke-linejoin':'round', 'pointer-events':'none'},x);make('polygon',{points:ptstr(p.pts),fill:'transparent',stroke:'none','pointer-events':p.placed?'none':'all'},x)}$('placed').textContent=tiles.filter(t=>t.placed).length+'/'+tiles.length;$('score').textContent=state.score;$('hintnum').textContent=state.hints}
function transform(p){const scale=p.placed?1:drag&&drag.id===p.id?1:.53;const [cx,cy]=p.c;return `translate(${p.dx} ${p.dy}) translate(${cx} ${cy}) scale(${scale}) rotate(${p.rot}) translate(${-cx} ${-cy})`}
function coordinate(e){const s=$('stage');let q=s.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const mat=s.getScreenCTM();return mat?q.matrixTransform(mat.inverse()):{x:0,y:0}}
function show(s){const n=$('notice');n.textContent=s;n.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('on'),1550)}
function beep(ok){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=ok?740:280;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.start();o.stop(c.currentTime+.13);setTimeout(()=>c.close(),250)}catch{}}
$('stage').addEventListener('pointerdown',e=>{if(phase!=='puzzle')return;const node=e.target.closest('[data-piece]');if(!node)return;const id=Number(node.dataset.piece),p=tiles[id];if(!p||p.placed)return;e.preventDefault();selected=id;const a=coordinate(e);drag={id,px:a.x,py:a.y,dx:p.dx,dy:p.dy,pointer:e.pointerId,moved:false};try{$('stage').setPointerCapture(e.pointerId)}catch{};node.classList.add('picked');node.setAttribute('transform',transform(p))});
$('stage').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;e.preventDefault();const now=coordinate(e),d=drag,p=tiles[d.id];let mx=now.x-d.px,my=now.y-d.py;if(Math.hypot(mx,my)>3)d.moved=true;p.dx=d.dx+mx;p.dy=d.dy+my;const node=$('tiles').querySelector('[data-piece="'+d.id+'"]');if(node)node.setAttribute('transform',transform(p))});
function onRelease(e){if(!drag||e.pointerId!==drag.pointer)return;e.preventDefault();const p=tiles[drag.id];if(!drag.moved){drag=null;render();show('Parçayı tut ve üstteki gölgesine sürükle.');return}drag=null;if(Math.hypot(p.dx,p.dy)<31&&p.rot%360===0){p.dx=0;p.dy=0;p.rot=0;p.placed=true;selected=null;beep(true);try{navigator.vibrate?.(15)}catch{};render();if(tiles.every(t=>t.placed))completePuzzle();}else{render();show(p.rot?'Gerekirse ↻ Döndür düğmesini kullan.':'Parçayı kendi gölgesine yerleştir.')}}
$('stage').addEventListener('pointerup',onRelease);$('stage').addEventListener('pointercancel',onRelease);
function completePuzzle(){phase='quiz';const elapsed=Math.ceil((Date.now()-started)/1000);$('app').classList.add('inquiz');$('quiz').classList.add('on');$('stage').setAttribute('viewBox','0 0 360 306');$('stage').querySelector('#tray').style.display='none';$('desc').textContent='Puzzle tamamlandı!';$('quiztag').textContent='PUZZLE TAMAMLANDI ✓ · '+elapsed+' SN';$('prompt').textContent=question.prompt;$('foot').textContent='Doğru cevap verirsen bir sonraki bölüme geçersin.';$('feedback').textContent='Şimdi doğru cevabı seç!';drawAnswers()}
function drawAnswers(){const box=$('answers');box.replaceChildren();answerOptions.forEach((ans,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=String.fromCharCode(65+i)+') '+ans;b.disabled=hiddenOptions.has(i);b.setAttribute('data-index',i);b.addEventListener('click',()=>choose(ans,b));box.appendChild(b)})}
function choose(ans,button){if(phase!=='quiz')return;if(ans!==question.correct){wrong++;button.classList.add('wrong');$('feedback').textContent='Yanlış! Tekrar dene.';$('feedback').className='feedback no';beep(false);try{navigator.vibrate?.(80)}catch{};return}phase='solved';button.classList.add('correct');for(const b of $('answers').querySelectorAll('button'))b.disabled=b!==button;const bonus=Math.max(20,100-wrong*15)+Math.max(0,Math.min(20,15-Number(tiles.length)));state.score+=bonus;state.levels[mode]=step+1;state.mode=mode;if((step+1)%5===0)state.hints=Math.min(20,state.hints+1);save();$('score').textContent=state.score;$('feedback').textContent='✅ Doğru! '+question.correct+' · +'+bonus+' puan';$('feedback').className='feedback ok';$('foot').textContent='Harika! Yeni puzzle bölümüne geç.';$('next').classList.add('show');$('bar').style.width=((step+1)/groups[mode].length*100)+'%';beep(true)}
$('next').addEventListener('click',()=>{const l=groups[mode];if(step+1>=l.length){$('feedback').textContent='🏆 Bu kategorideki tüm bölümleri tamamladın!';$('next').classList.remove('show');return}newLevel()});
$('mode').addEventListener('change',e=>{mode=e.target.value;state.mode=mode;save();newLevel()});
$('rotate').addEventListener('click',()=>{if(phase!=='puzzle')return;const p=tiles.find(p=>p.id===selected&&!p.placed)||tiles.find(p=>!p.placed);if(!p)return;selected=p.id;p.rot=(p.rot+90)%360;render();show('Parça 90° döndürüldü.');});
$('hint').addEventListener('click',()=>{if(!state.hints){show('İpucun kalmadı. Her 5 bölümde 1 ipucu kazan.');return}if(phase==='puzzle'){const p=tiles.find(p=>!p.placed);if(!p)return;state.hints--;p.placed=true;p.dx=p.dy=p.rot=0;save();render();beep(true);if(tiles.every(x=>x.placed))completePuzzle();else show('Bir parça yerine oturdu.')}else if(phase==='quiz'){state.hints--;save();const wrongIndices=answerOptions.map((x,i)=>x!==question.correct?i:-1).filter(x=>x>=0);hiddenOptions=new Set(shuffle(wrongIndices,step^hash(question.id)).slice(0,2));drawAnswers();show('İki yanlış seçenek elendi.');$('hintnum').textContent=state.hints}});
$('reset').addEventListener('click',()=>{if(phase==='puzzle')newLevel()});$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'♫':'♩';show(sound?'Ses açık':'Ses kapalı')});
newLevel();window.__brainGame={getState:()=>({mode,step:step+1,total:groups[mode].length,totalMixed:groups['Karışık'].length,phase,question:question?.id,correct:question?.correct,score:state.score,tiles:tiles.map(x=>({id:x.id,dx:x.dx,dy:x.dy,rot:x.rot,placed:x.placed}))}),finishPuzzleForTest:()=>{if(phase!=='puzzle')return;for(const t of tiles){t.dx=t.dy=t.rot=0;t.placed=true}render();completePuzzle()},selectAnswerForTest:(ans)=>{const b=[...$('answers').children].find(x=>x.textContent.endsWith(ans));if(b)b.click()},levels:()=>Object.fromEntries(Object.entries(groups).map(([k,x])=>[k,x.length])),debugNext:()=>{state.levels[mode]=step+1;save();newLevel()}};
})();</script></body></html>
