function buildPieces(){const p=patterns[(level-1)%patterns.length];grid=reshaped(p,Math.floor((level-1)/patterns.length)%4);rows=grid.length;cols=Math.max(...grid.map(r=>r.length));grid=grid.map(r=>Array.from({length:cols},(_,i)=>r[i]||0));
 const visited=new Set();const cells=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x])cells.push({x,y});

 groups.forEach((p,i)=>p.rot=(level===1||p.cells.length===1)?0:Math.floor(rng()*4));pieces=groups.sort(()=>rng()-.5);placedCount=0;selected=null;completed=false;preview=null;
 $('levelTitle').textContent=`Bölüm ${level}: ${p.n}`;$('levelTag').textContent=level<=5?'BAŞLANGIÇ • KOLAY':level<=15?'ISINMA • ORTA':level<=35?'USTALIK • ZOR':'BEYİN GÜCÜ • UZMAN';$('progress').textContent=`0 / ${pieces.length}`;$('score').textContent=score;$('hintCount').textContent=hints;
 const tier=Math.min(3,Math.floor((level-1)/20));$('rankname').textContent=['KAFA TASI','ZOMBİ','HAYALET','DAHİ'][tier];document.querySelectorAll('.rank').forEach((e,i)=>e.classList.toggle('on',i<=tier));$('rankfill').style.width=`${tier*28}%`;
 elapsed=0;start=Date.now();clearInterval(interval);interval=setInterval(()=>{if(!completed){elapsed=Math.floor((Date.now()-start)/1000);$('clock').textContent='⏱ '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')}},800);$('clock').textContent='⏱ 00:00';
 renderTray();renderBoard()}
function colorCell(c,x,y,S,sub=0){const [light,dark]=c;const stroke='#0a193d';const d=`M${x} ${y}h${S}v${S}h${-S}z`;return `<path d="${d}" fill="${dark}" stroke="${stroke}" stroke-width="1.4"/><path d="M${x} ${y} L${x+S} ${y} L${x} ${y+S}Z" fill="${light}" opacity=".96"/><path d="M${x+S} ${y+S} L${x+S} ${y} L${x} ${y+S}Z" fill="${dark}"/><path d="M${x+3} ${y+3}L${x+S*.62} ${y+3}L${x+3} ${y+S*.62}Z" fill="#fff" opacity=".09"/><path d="M${x+S} ${y}L${x} ${y+S}" stroke="#ffffff42" stroke-width=".8"/>`}

 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x])html+=`<rect class="goalcell" x="${ox+x*S}" y="${oy+y*S}" width="${S}" height="${S}" rx="1"/>`;

function pointerDown(e){if(e.button!==0||completed)return;let p=pieces.find(x=>x.id===Number(e.currentTarget.dataset.id));if(!p||p.placed)return;selected=p;document.querySelectorAll('.piececard').forEach(n=>n.classList.toggle('selected',Number(n.dataset.id)===p.id));const node=e.currentTarget;drag={p,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false,pointerId:e.pointerId};try{node.setPointerCapture(e.pointerId)}catch(err){};const ghost=$('dragghost');ghost.innerHTML=traySVG(p);ghost.classList.add('hidden');window.addEventListener('pointermove',pointerMove);window.addEventListener('pointerup',pointerUp);window.addEventListener('pointercancel',pointerCancel)}

function shake(){const b=$('rotate');b.animate([{transform:'translateX(-4px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:240})}
function say(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>t.classList.remove('show'),1800)}
function sparkle(x,y,n){const colors=['#4ff3cf','#ffc454','#ff6e90','#84c0ff','#a98bff'];for(let i=0;i<n;i++){const node=document.createElement('i');node.className='particle';node.style.left=x+'px';node.style.top=y+'px';node.style.background=colors[i%colors.length];node.style.setProperty('--dx',((Math.random()-.5)*185)+'px');node.style.setProperty('--dy',((Math.random()-.5)*200)+'px');node.style.setProperty('--turn',(Math.random()*800)+'deg');document.body.append(node);setTimeout(()=>node.remove(),900)}}
let hintsUsed=0;function complete(){completed=true;clearInterval(interval);const secs=Math.floor((Date.now()-start)/1000),stars=secs<(pieces.length*10)?3:secs<(pieces.length*20)?2:1;const gain=stars*20+10;score+=gain;if(stars>=2)hints=Math.min(20,hints+1);save();$('score').textContent=score;$('hintCount').textContent=hints;$('stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('wintext').innerHTML=`${pieces.length} parçayı ${secs} saniyede tamamladın!<br>+${gain} puan${stars>=2?' · +1 ipucu':''}`;setTimeout(()=>{$('modal').classList.remove('hidden');for(let i=0;i<4;i++)setTimeout(()=>sparkle(innerWidth*(.25+.15*i),innerHeight*.45,12),i*160)},360)}
$('rotate').addEventListener('click',()=>{if(!selected){say('Önce alttan bir parça seç.');return}selected.rot=(selected.rot+1)%4;renderTray();try{navigator.vibrate?.(10)}catch(e){}});
$('hint').addEventListener('click',()=>{if(hints<1){say('İpucun kalmadı. Bölümlerden kazanabilirsin.');return}const p=selected&&!selected.placed?selected:pieces.find(x=>!x.placed);if(!p)return;selected=p;hints--;hintsUsed++;$('hintCount').textContent=hints;preview=p;p.rot=0;renderTray();renderBoard();say('Parçanın yeri birkaç saniye gösterildi.');save();setTimeout(()=>{preview=null;renderBoard()},2300)});
$('restart').addEventListener('click',()=>{if(!completed){buildPieces();say('Bölüm yeniden başladı.')}});
$('next').addEventListener('click',()=>{level++;save();$('modal').classList.add('hidden');hintsUsed=0;buildPieces()});$('replay').addEventListener('click',()=>{$('modal').classList.add('hidden');hintsUsed=0;buildPieces()});
window.addEventListener('resize',()=>renderBoard());document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(interval);else{start=Date.now()-elapsed*1000;clearInterval(interval);interval=setInterval(()=>{if(!completed){elapsed=Math.floor((Date.now()-start)/1000);$('clock').textContent='⏱ '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')}},800)}});
buildPieces();
})();
</script></body></html>
