name: Zeka Mozaik Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'zeka-mozaik/index.html'
      - 'zeka-mozaik/app/**'
      - '.github/workflows/zeka-mozaik-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeka-mozaik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZekaMozaik-Android-APK
          path: zeka-mozaik/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK link
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZekaMozaik.apk
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zeka-mozaik/ZekaMozaik.apk
          git commit -m 'Build Zeka Mozaik debug APK [skip ci]' || exit 0
          git push
