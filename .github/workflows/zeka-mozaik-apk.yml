name: Zeka Mozaik Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'zeka-mozaik/index.html'
      - 'zeka-mozaik/app/**'
      - '.github/workflows/zeka-mozaik-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeka-mozaik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          else
            echo "SDK commandline tools not found; use preinstalled SDK"
            ls -la "$ANDROID_HOME/platforms" || true
          fi
      - name: Bundle 195 licensed SVG country flags
        run: |
          python3 - <<'PY'
          import io, re, pathlib, zipfile, urllib.request
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          region = html.split('const COUNTRIES=',1)[1].split(';',1)[0]
          codes = sorted({c.lower() for c in re.findall(r'\["([A-Z]{2})",', region)})
          assert len(codes) == 195, ('Expected 195 countries',len(codes))
          archive = 'https://github.com/lipis/flag-icons/archive/refs/tags/v7.6.0.zip'
          with urllib.request.urlopen(archive,timeout=80) as response:
              z = zipfile.ZipFile(io.BytesIO(response.read()))
          names = {name.rsplit('/',1)[-1]:name for name in z.namelist() if '/flags/4x3/' in name and name.endswith('.svg')}
          for code in codes:
              file_name=code+'.svg'
              if file_name not in names: raise RuntimeError('Missing flag for '+code)
              data = z.read(names[file_name])
              assert b'<svg' in data[:1000], (code,'Bad SVG')
              for directory in (pathlib.Path('flags'),pathlib.Path('app/src/main/assets/flags')):
                  directory.mkdir(parents=True,exist_ok=True)
                  (directory/file_name).write_bytes(data)
          license_file = next((n for n in z.namelist() if n.endswith('/LICENSE') or n.endswith('/LICENSE.md')),None)
          assert license_file
          for directory in (pathlib.Path('flags'),pathlib.Path('app/src/main/assets/flags')):
              (directory/'LICENSE.txt').write_bytes(z.read(license_file))
          print('Bundled',len(codes),'MIT-licensed flag SVG files')
          PY
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZekaMozaik-Android-APK
          path: zeka-mozaik/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK link
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZekaMozaik.apk
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zeka-mozaik/ZekaMozaik.apk zeka-mozaik/flags
          git commit -m 'Build Zeka Mozaik debug APK [skip ci]' || exit 0
          git push
